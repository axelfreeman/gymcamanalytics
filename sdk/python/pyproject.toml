[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gymcam-sdk"
version = "1.1.0"
description = "Official Python SDK for GymCam Analytics — gym attendance and trainer-performance analytics."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Axel Freeman" }]
requires-python = ">=3.9"
keywords = ["gymcam", "gym", "attendance", "analytics", "fitness", "mcp"]
dependencies = ["httpx>=0.24"]

[project.scripts]
gymcam = "gymcam_sdk.cli:main"

[project.urls]
Homepage = "https://gymcamanalytics.com"
Repository = "https://github.com/axelfreeman/gymcamanalytics"

[tool.hatch.build.targets.wheel]
packages = ["gymcam_sdk"]
