[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gymcam-analytics"
version = "0.1.0"
description = "MCP server: gym attendance & trainer analytics from existing cameras"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Axel Freeman" }]
keywords = ["mcp", "gym", "fitness", "attendance", "computer-vision", "analytics"]
dependencies = ["mcp>=1.2.0,<2.0.0"]

[project.urls]
Homepage = "https://gymcamanalytics.com"
Repository = "https://github.com/axelfreeman/gymcamanalytics"

[project.scripts]
gymcam = "gymcam.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gymcam"]
